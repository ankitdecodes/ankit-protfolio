<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Ankit Pal</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { color-scheme: light; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8f7f4; color: #172033;
        font-family: ui-sans-serif, system-ui, sans-serif; padding: 1rem; }
      main { max-width: 32rem; }
      code { font-family: ui-monospace, monospace; color: #4459f0; font-size: .85rem; }
      h1 { font-size: clamp(2rem, 6vw, 3.5rem); letter-spacing: -.04em; line-height: 1.05; margin: 1rem 0; }
      p { color: #4a5568; line-height: 1.6; }
      a { display: inline-flex; margin-top: 1.5rem; padding: .8rem 1.25rem; border-radius: 999px; background: #172033;
        color: #f8f7f4; text-decoration: none; font-weight: 500; }
      a:hover { background: #4459f0; }
      a:focus-visible { outline: 2px solid #4459f0; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <code>404 · route not found</code>
      <h1>This page doesn’t exist.</h1>
      <p>The link may be outdated, or the address may have a typo.</p>
      <a id="home" href="/">Back to the portfolio</a>
    </main>
    <script>
      // GitHub Pages project sites live under /<repo>/; elsewhere the site is at the root.
      var seg = location.pathname.split('/')[1]
      var base = location.hostname.endsWith('github.io') && seg ? '/' + seg + '/' : '/'
      document.getElementById('home').href = base
      document.querySelector('link[rel=icon]').href = base + 'favicon.svg'
    </script>
  </body>
</html>
